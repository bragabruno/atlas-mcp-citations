{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "atlas-mcp-citations.fullname" . }}
  labels:
    {{- include "atlas-mcp-citations.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "atlas-mcp-citations.selectorLabels" . | nindent 6 }}
  template:
    {{- include "atlas-mcp-citations.podSpec" . | nindent 4 }}
  strategy:
    canary:
      autoPromotionEnabled: {{ .Values.canary.autoPromotionEnabled }}
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
{{- end }}
